apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{values.name}}-config
  namespace: ${{values.namespace}}
data:
  SERVER_NAME: "${{values.name}}"
  SERVER_VERSION: "1.0.0"
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  INSURANCE_API_BASE_URL: "${{values.backendApiUrl}}"
  INSURANCE_API_TIMEOUT: "30"
  ENABLE_CACHING: "true"
  CACHE_TTL: "3600"
