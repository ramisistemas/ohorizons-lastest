apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: h1-tasks-api
  title: "Tasks API (Node.js + PostgreSQL)"
  description: >
    Genera un microservicio Node.js/Express con CRUD REST de tareas sobre
    PostgreSQL, y lo publica como repo nuevo en github.com/. No registra
    el componente en el catálogo.
  tags:
    - h1-foundation
    - nodejs
    - express
    - postgresql
    - tasks-api
spec:
  owner: group:default/platform-engineering
  type: service

  parameters:
    - title: Datos del proyecto
      required:
        - name
        - owner
      properties:
        name:
          title: Nombre del proyecto
          type: string
          description: Se usa en package.json, catalog-info.yaml y como nombre del repo nuevo en GitHub
          default: ohorizons-tasks-api
        owner:
          title: Owner
          type: string
          description: Equipo o persona dueña del componente (se guarda en catalog-info.yaml, no se registra automáticamente)
          default: group:default/platform-engineering

  steps:
    - id: fetch
      name: Copiar plantilla
      action: fetch:template
      input:
        url: ./skeleton/app
        values:
          name: ${{ parameters.name }}
          owner: ${{ parameters.owner }}

    - id: publish
      name: Publicar en GitHub
      action: publish:github
      input:
        repoUrl: github.com?repo=${{ parameters.name }}&owner=ramisistemas
        description: Generado desde la plantilla tasks-api
        repoVisibility: public
        defaultBranch: main

  output:
    links:
      - title: Repositorio en GitHub
        url: ${{ steps.publish.output.remoteUrl }}
