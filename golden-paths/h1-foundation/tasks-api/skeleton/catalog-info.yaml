apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{values.name | dump}}
  description: ${{values.description | dump}}
  annotations:
    github.com/project-slug: ${{values.repoUrl | parseRepoUrl | pick('owner') }}/${{values.name}}
    backstage.io/techdocs-ref: dir:.
    argocd/app-name: ${{values.name}}
  tags:
    - microservice
    - nodejs
    - tasks-api
    - h1-foundation
  links:
    - url: https://github.com/${{values.repoUrl | parseRepoUrl | pick('owner') }}/${{values.name}}
      title: GitHub Repository
      icon: github
spec:
  type: service
  lifecycle: ${{values.lifecycle}}
  owner: ${{values.owner}}
  system: ${{values.system}}
  providesApis:
    - ${{values.name}}-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: ${{values.name}}-api
  description: CRUD API de tareas para ${{values.name}}
spec:
  type: openapi
  lifecycle: ${{values.lifecycle}}
  owner: ${{values.owner}}
  definition: |
    openapi: 3.0.0
    info:
      title: ${{values.name}} API
      version: 1.0.0
    paths:
      /health:
        get:
          summary: Health check endpoint
          responses:
            '200':
              description: Service is healthy
      /ready:
        get:
          summary: Readiness probe (verifica conexión a la base de datos)
          responses:
            '200':
              description: Service is ready
            '503':
              description: Service is not ready
      /metrics:
        get:
          summary: Prometheus metrics
          responses:
            '200':
              description: Metrics in Prometheus text format
      /tasks:
        get:
          summary: Lista todas las tareas
          responses:
            '200':
              description: Array de tareas
        post:
          summary: Crea una tarea
          responses:
            '201':
              description: Tarea creada
            '400':
              description: title requerido
      /tasks/{id}:
        get:
          summary: Obtiene una tarea por id
          responses:
            '200':
              description: Tarea encontrada
            '404':
              description: No encontrada
        patch:
          summary: Actualiza una tarea
          responses:
            '200':
              description: Tarea actualizada
            '404':
              description: No encontrada
        delete:
          summary: Elimina una tarea
          responses:
            '204':
              description: Eliminada
            '404':
              description: No encontrada
